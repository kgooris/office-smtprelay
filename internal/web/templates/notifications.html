{{define "content"}}
<h1>{{t "notify.title"}}</h1>
<p class="muted">{{t "notify.intro"}}</p>
{{with .Data}}
<form method="post" action="/notifications">
  <input type="hidden" name="csrf" value="{{$.CSRF}}">
  <div class="card">
    <label class="check"><input type="checkbox" name="enabled" value="1" {{if .Enabled}}checked{{end}}> {{t "notify.enabled"}}</label>
    <label for="to">{{t "notify.to"}}</label>
    <input id="to" type="email" name="to" value="{{.To}}" placeholder="admin@yourdomain.com">
    <label for="from">{{t "notify.from"}}</label>
    <input id="from" type="email" name="from" value="{{.From}}" placeholder="printer@yourdomain.com">
    <p class="hint">{{t "notify.from_hint"}}</p>
  </div>
  <div class="card">
    <h2>{{t "notify.which"}}</h2>
    {{range $k := .All}}
    <label class="check"><input type="checkbox" name="kind_{{$k}}" value="1" {{if index $.Data.Kinds $k}}checked{{end}}> {{t (printf "notify.kind_%s" $k)}}</label>
    <p class="hint">{{t (printf "notify.kind_%s_hint" $k)}}</p>
    {{end}}
  </div>
  <div class="actions"><button type="submit">{{t "notify.save"}}</button></div>
</form>

<div class="card">
  <h2>{{t "notify.test_title"}}</h2>
  <p class="hint">{{t "notify.test_hint"}}</p>
  <form method="post" action="/notifications/test">
    <input type="hidden" name="csrf" value="{{$.CSRF}}">
    <div class="card-foot"><button type="submit" class="secondary">{{t "notify.test_send"}}</button></div>
  </form>
</div>
<p class="hint">{{t "notify.limits"}}</p>
{{end}}
{{end}}
