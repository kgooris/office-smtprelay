{{define "content"}}
<h1>{{t "backup.title"}}</h1>
<p class="muted">{{t "backup.intro"}}</p>

<div class="card">
  <h2>{{t "backup.export_title"}}</h2>
  <p class="hint">{{t "backup.export_hint"}}</p>
  <div class="flash warn">{{t "backup.sensitive"}}</div>
  <form method="post" action="/backup/export">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <div class="card-foot"><button type="submit">{{t "backup.export_button"}}</button></div>
  </form>
</div>

<div class="card">
  <h2>{{t "backup.import_title"}}</h2>
  <p class="hint">{{t "backup.import_hint"}}</p>
  <form method="post" action="/backup/import" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="file">{{t "backup.file"}}</label>
    <input id="file" type="file" name="file" accept=".json,application/json" required>
    <div class="card-foot"><button type="submit" class="secondary">{{t "backup.import_button"}}</button></div>
  </form>
</div>

<div class="card">
  <h2>{{t "backup.volume_title"}}</h2>
  <p class="hint">{{t "backup.volume_hint"}}</p>
</div>
{{end}}
