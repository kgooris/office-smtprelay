{{define "content"}}
<div class="card narrow">
  <h1>{{t "setup.title"}}</h1>
  <p>{{t "setup.intro"}}</p>
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{if .Data.NeedToken}}
    <label for="token">{{t "setup.token"}}</label>
    <input id="token" type="text" name="token" autocomplete="off" required>
    <p class="hint">{{t "setup.token_hint"}}</p>
    {{end}}
    <label for="password">{{t "setup.password"}}</label>
    <input id="password" type="password" name="password" autocomplete="new-password" minlength="12" required>
    <p class="hint">{{t "setup.password_hint"}}</p>
    <label for="confirm">{{t "setup.confirm"}}</label>
    <input id="confirm" type="password" name="confirm" autocomplete="new-password" minlength="12" required>
    <div class="card-foot"><button type="submit">{{t "setup.submit"}}</button></div>
  </form>
</div>
{{end}}
